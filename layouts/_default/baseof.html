<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>{{ block "title" . }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="viewport" content="width=device-width,minimum-scale=1">
    <meta name="generator" content="Hugo {{ hugo.Version }}" />
    
    {{ if .Params.robots }}
      <meta name="robots" content="{{ .Params.robots }}" />
    {{ end }}

    <!-- Tachyons CSS & Ananke CSS -->
    <link rel="stylesheet" href="https://unpkg.com/tachyons@4.12.0/css/tachyons.min.css"/>
    {{ $styles := resources.Get "ananke/css/main.min.css" }}
    {{ if $styles }}
      <link rel="stylesheet" href="{{ $styles.RelPermalink }}">
    {{ else }}
      <link rel="stylesheet" href="/ananke/css/main.min.css">
    {{ end }}

    {{ block "custom-head" . }}{{ end }}
  </head>

  <body class="ma0 {{ $.Param "body_classes" | default "sans-serif" }}">
    
    <!-- SIVUSTON OMA YLÄVALIKKO -->
    {{ partial "site-header.html" . }}

    <main class="pb7" role="main">
      {{ block "main" . }}{{ end }}
    </main>

    {{ block "footer" . }}
      {{ partial "site-footer.html" . }}
    {{ end }}
  </body>
</html>
